name: Deploy PISS Company Profile

on:
  push:
    branches:
      - master

concurrency:
  group: piss-compro-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Update source code
        run: |
          set -e
          cd /srv/docker/projects/piss-compro
          git fetch origin master
          git reset --hard origin/master

      - name: Build and restart Docker container
        run: |
          set -e
          cd /srv/docker/projects/piss-compro
          docker compose up -d --build

      - name: Verify website
        run: |
          set -e
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1:3000/ > /dev/null
          echo "Deployment successful"
